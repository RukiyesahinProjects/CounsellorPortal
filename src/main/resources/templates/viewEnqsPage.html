<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">

        <ul class="nav">
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Add Enquiries</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">View Enquiries</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Logout</a>
            </li>
        </ul>
        <hr/>
        <h2> View Enquiries Page</h2>

        <form th:action="@{/filter-enqs}" th:object="${viewEnqsFilterRequest}" method="post">

            <table>
                <tr>
                    <td>
                        Class Mode :
                        <select th:field="*{classMode}" >
                              <option value="">-Select-</option>
                              <option value="Online">Online</option>
                              <option value="Classroom">Classroom</option>
                        </select>
                    </td>
                    <td>
                        Course Name :
                        <select th:field="*{courseName}" >
                              <option value="">-Select-</option>
                              <option value="Java">Java</option>
                              <option value="Python">Python</option>
                              <option value="DevOps">DevOps</option>
                              <option value="AWS">AWS</option>
                        </select>
                    </td>
                    <td>
                        Enquiry Status :
                        <select th:field="*{enqStatus}" >
                              <option value="">-Select-</option>
                              <option value="Open">Open</option>
                              <option value="Enrolled">Enrolled</option>
                              <option value="Lost">Lost</option>
                        </select>
                    </td>
                    <td>
                        <input type="submit" value="Filter Enquiries" class="btn btn-primary"/>
                    </td>
                </tr>
            </table>

        </form>

        <div class="table-responsive">

        <table class="table table-bordered table-striped">

            <thead class="table-dark">
                    <th>S.No</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Mode</th>
                    <th>Phone</th> 
                    <th>Status</th>
                    <th>Edit</th>

            </thead>
                <tbody>

                  <tr th:each:="enq, loopCounter ${enquiries}">
                      <td th:text="${loopCounter.index + 1}"></td>
                      <td th:text="${enq.stuName}"></td>
                      <td th:text="${enq.courseName}"></td>
                      <td th:text="${enq.classMode}"></td>
                      <td th:text="${enq.studentPhone}"></td>
                      <td th:text="${enq.enqStatus}"></td>
                      <td>
                          <a th:href="@{'/editEnq?enqId'+${enq.enqId}}">Edit</a>
                      </td>
                 </tr>
                <tr th:if="${enquiries.size()==0}">
                    <td colspan="7">
                        No Record Found
                    </td>
                </tr>
                </tbody>
        </table>
        </div>

    </div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
